<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="TREK video tour — click to play">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="360" r="400" fill="url(#halo)"/>
  <!-- TREK mark centered above the play button -->
  <g transform="translate(540 190) scale(0.5)" fill="#FFFFFF" opacity="0.95">
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="72" font-weight="900" letter-spacing="8">TREK</text>
  </g>
  <!-- Big play button -->
  <g transform="translate(640 400)">
    <circle r="72" fill="#FFFFFF" opacity="0.12" filter="url(#glow)"/>
    <circle r="56" fill="#FFFFFF"/>
    <path d="M -16 -22 L 24 0 L -16 22 Z" fill="#111827"/>
  </g>
  <!-- Caption -->
  <text x="640" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">The 60-second tour</text>
  <text x="640" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="0.3" fill="#9CA3AF">Trip planner, maps, collab, budget, and more</text>
</svg>
