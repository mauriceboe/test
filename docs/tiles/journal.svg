<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="JOURNEY: A journal for every trip">
  <defs>
    <clipPath id="r"><rect width="520" height="260" rx="22"/></clipPath>
    <filter id="iconSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="520" height="260" fill="#FBDAE4"/>
    <!-- subtle radial highlight in corner -->
    <circle cx="520" cy="0" r="220" fill="#FFFFFF" opacity="0.35"/>
    <!-- icon faint in background -->
    <g transform="translate(390 22) scale(6)" fill="none" stroke="#9A2F58" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.10">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </g>
    <!-- compact icon badge top-right -->
    <rect x="438" y="30" width="52" height="52" rx="14" fill="#FFFFFF" opacity="0.7"/>
    <g transform="translate(451 43) scale(1.08)" fill="none" stroke="#9A2F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </g>
    <!-- eyebrow -->
    <text x="36" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4" fill="#9A2F58">JOURNEY</text>
    <!-- title line 1 -->
    <text x="36" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#1A1A1F">A journal for</text>
    <!-- title line 2 -->
    <text x="36" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#9A2F58">every trip</text>
    <!-- subtitle -->
    <text x="36" y="222" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" fill="#6E3345">Magazine-style entries with photos, maps, moods</text>
  </g>
</svg>