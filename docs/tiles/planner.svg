<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="TRIP PLANNER: Drag & drop day by day">
  <defs>
    <clipPath id="r"><rect width="520" height="260" rx="22"/></clipPath>
    <filter id="iconSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="520" height="260" fill="#FFE8D9"/>
    <!-- subtle radial highlight in corner -->
    <circle cx="520" cy="0" r="220" fill="#FFFFFF" opacity="0.35"/>
    <!-- icon faint in background -->
    <g transform="translate(390 22) scale(6)" fill="none" stroke="#B5492D" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.10">
      <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>
    </g>
    <!-- compact icon badge top-right -->
    <rect x="438" y="30" width="52" height="52" rx="14" fill="#FFFFFF" opacity="0.7"/>
    <g transform="translate(451 43) scale(1.08)" fill="none" stroke="#B5492D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>
    </g>
    <!-- eyebrow -->
    <text x="36" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4" fill="#B5492D">TRIP PLANNER</text>
    <!-- title line 1 -->
    <text x="36" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#1A1A1F">Drag & drop</text>
    <!-- title line 2 -->
    <text x="36" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#B5492D">day by day</text>
    <!-- subtitle -->
    <text x="36" y="222" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" fill="#7C3B2A">Reorder stops, jump between days, optimise routes</text>
  </g>
</svg>